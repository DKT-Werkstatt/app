
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>DKT-Werkstatt – Anmeldung</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .login {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      background: #19283d;
      border: 1px solid #34465f;
      border-radius: 16px;
    }

    .logo {
      display: block;
      width: 220px;
      max-width: 100%;
      margin: 0 auto 20px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      color: #b7c8dd;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #52627a;
      border-radius: 8px;
      background: #0b1220;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #1976d2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #meldung {
      min-height: 20px;
      margin-top: 16px;
      text-align: center;
      color: #ffb6b6;
    }
  </style>
</head>
<body>
  <main class="login">
    <!-- Dateiname bei Bedarf anpassen -->
    <img class="logo" src="dkt-logo.png" alt="DKT-Logo">

    <h1>Mitarbeiter-Anmeldung</h1>
    <p>DKT-Werkstatt</p>

    <form id="loginForm">
      <label for="benutzername">Benutzername</label>
      <input id="benutzername"
             autocomplete="username"
             required>

      <label for="passwort">Passwort</label>
      <input id="passwort"
             type="password"
             autocomplete="current-password"
             required>

      <button type="submit">Anmelden</button>
    </form>

    <div id="meldung" role="status"></div>
  </main>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();

        document.getElementById("meldung")
          .textContent =
          "Die sichere Anmeldung wird im nächsten Schritt verbunden.";
      });
  </script>
</body>
</html>
